name: BK-W8 firmware

# Builds only the BK7252 slot image this fork exists for. The upstream workflow in
# workflow.yaml covers 60 other platforms and is not wanted here; disable it in the
# repository's Actions settings rather than editing it, so it never conflicts on a
# merge from upstream.
#
# The "upstream" leg merges both upstream masters and builds the result. It pushes
# nothing. Its whole job is to go red when upstream breaks this board, which is the
# failure that cost a whole session once already.
#
# GitHub runs a scheduled workflow only from the DEFAULT branch's copy of this file,
# so the weekly run does nothing until this file is on the default branch too. The
# checkout below pins the branch to build, so putting it there is safe and does not
# make the schedule build the wrong tree.

on:
  push:
    branches: [bkcamera-driver]
  pull_request:
    branches: [bkcamera-driver]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_UPSTREAM: https://github.com/openshwprojects/OpenBK7231T_App.git
  SDK_UPSTREAM: https://github.com/NonPIayerCharacter/beken_freertos_sdk.git

jobs:
  build:
    name: build (${{ matrix.tree }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tree: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ours","upstream"]') || fromJSON('["ours"]') }}

    steps:
      - uses: actions/checkout@v5
        with:
          # A scheduled run would otherwise check out the default branch.
          ref: ${{ github.event_name == 'schedule' && 'bkcamera-driver' || github.ref }}
          fetch-depth: 0

      # Only this submodule. `submodules: recursive` would also fetch the RTL and other
      # platform SDKs, which this board does not build. Full history, because the
      # upstream leg needs a merge base.
      - name: Check out the SDK
        run: git submodule update --init sdk/beken_freertos_sdk

      - name: Merge upstream
        if: matrix.tree == 'upstream'
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@localhost"
          for d in . sdk/beken_freertos_sdk; do
            if [ "$d" = "." ]; then url=$APP_UPSTREAM; else url=$SDK_UPSTREAM; fi
            git -C "$d" remote add upstream "$url" 2>/dev/null \
              || git -C "$d" remote set-url upstream "$url"
            git -C "$d" fetch --no-tags upstream master
            echo "$d is $(git -C "$d" rev-list --count HEAD..upstream/master) commits behind upstream"
            git -C "$d" merge --no-edit upstream/master
          done
          # Stage the moved gitlink, or the submodule update inside prebuild would
          # check the recorded commit back out and silently undo the merge above.
          git add sdk/beken_freertos_sdk

      # Berry is a second submodule and its resources are generated by a script, so a
      # clean checkout cannot link without this. prebuild also untars the toolchain.
      # It is not the OpenBK7252 target and runs none of that target's flashing tools.
      - name: Prebuild
        run: |
          make prebuild_OpenBK7252
          sdk/beken_freertos_sdk/toolchain/arm-none-eabi/bin/arm-none-eabi-gcc --version | head -1

      # build.sh directly, never `make OpenBK7252`. That target runs rt_partition_tool
      # to write a stock 2 MB table into a bootloader copy and builds a full-flash image
      # around it. On this board the bootloader cannot be rewritten, so that image is a
      # way to destroy it. FREERTOS_EXEC_PATH is the variable application.mk reads;
      # ARM_GCC_TOOLCHAIN on the command line does nothing. The version stays 1.0.0 so
      # the artifact can be compared byte for byte against a local build.
      - name: Build
        working-directory: sdk/beken_freertos_sdk
        run: |
          export FREERTOS_EXEC_PATH="$PWD/toolchain/arm-none-eabi/bin/"
          OBK_VARIANT=OpenBK7252 sh build.sh bk7251 1.0.0

      # The linker region is the real gate and already fails the build when the image
      # would overrun the trampoline. This reports how much room is left, because the
      # slot is nearly full and the trend is what matters.
      - name: Slot usage
        working-directory: sdk/beken_freertos_sdk
        run: |
          read -r origin length < <(awk '/^flash /{print $2, $3}' out/bk7231_bsp.map)
          size=$(stat -c%s out/bsp.bin)
          spare=$(( length - size ))
          printf 'slot %s for %d bytes, image %d bytes, %d spare\n' \
            "$origin" "$length" "$size" "$spare"
          {
            echo "### BK-W8 slot (${{ matrix.tree }})"
            echo ''
            echo '| | bytes |'
            echo '| --- | --- |'
            echo "| slot at $origin | $length |"
            echo "| image | $size |"
            echo "| spare | $spare |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$spare" -ge 0

      - name: Record what built it
        working-directory: sdk/beken_freertos_sdk
        run: |
          {
            echo "app $(git -C ../.. rev-parse HEAD)"
            echo "sdk $(git rev-parse HEAD)"
            ./toolchain/arm-none-eabi/bin/arm-none-eabi-gcc --version | head -1
            strings out/bsp.bin | grep -m1 'Built on'
            sha256sum out/bsp.bin
          } | tee out/provenance.txt

      # bsp.bin only. The image this board actually flashes is spliced locally from
      # bsp.bin plus 803 kB of the camera vendor's own firmware, which does not belong
      # in a public repository, so CI cannot and should not produce a flashable image
      # while the A/B slot is still in use.
      - uses: actions/upload-artifact@v4
        with:
          name: bk-w8-${{ matrix.tree }}-bsp
          path: |
            sdk/beken_freertos_sdk/out/bsp.bin
            sdk/beken_freertos_sdk/out/bk7231_bsp.map
            sdk/beken_freertos_sdk/out/provenance.txt
          if-no-files-found: error
